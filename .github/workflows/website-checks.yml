name: Website browser checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cross_browser:
        description: 'Run slower Chromium + WebKit compatibility suite'
        type: boolean
        required: false
        default: false
jobs:
  browser-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CAKES_TEST_BROWSERS: ${{ inputs.cross_browser == true && 'chromium,webkit' || 'chromium' }}
      CAKES_USE_SYSTEM_CHROME: ${{ inputs.cross_browser == true && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # GitHub-hosted ubuntu-24.04 already includes Google Chrome and its OS
      # libraries. Normal PR/push checks use that browser directly, avoiding
      # expensive apt downloads (previously 181 packages) on every run.
      - name: Install Playwright Python package
        run: python -m pip install playwright==1.57.0
      - name: Install additional browsers for manual cross-browser checks
        if: ${{ inputs.cross_browser == true }}
        timeout-minutes: 10
        run: python -m playwright install --with-deps chromium webkit
      - name: Validate JavaScript syntax and catalogue parity
        run: |
          node --check catalog.js
          node --check app.js
          node --check admin.js
          node tests/catalog-parity.cjs
      - name: Validate architecture contracts
        run: python tests/architecture_contracts.py
      - name: Validate transactional email contracts
        run: python tests/test_customer_email_notifications.py
      - name: Validate acknowledgment retry and email audit permissions
        run: python tests/test_acknowledgment_retry.py
      - name: Validate production readiness source contracts
        run: python tests/production_readiness.py
      - name: Validate owner-only deletion safeguards
        run: python tests/test_owner_deletion_contracts.py
      - name: Check Dean-only delete and restore UI with mocked records
        run: python tests/owner_bulk_delete_ui.py
      - name: Validate password-only admin security contracts
        run: python tests/test_password_only_admin_contracts.py
      - name: Validate admin 30-minute inactivity timeout
        run: python tests/test_admin_idle_timeout.py
      - name: Verify admin password login without an authenticator
        run: python tests/admin_password_only.py
      - name: Run responsive browser checks
        run: python tests/smoke.py
      - name: Check admin email draft formatting
        run: python tests/admin_email_draft.py

  hosted-api-negative-checks:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject malformed API requests without writing customer records
        run: python tests/hosted_negative.py
      - name: Verify deployed website and admin entry points
        run: python tests/live_pages.py

  live-enquiry-check:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[live-enquiry-test]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the real customer enquiry API
        run: python tests/live_submission.py
