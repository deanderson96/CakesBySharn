<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Cakes by Sharn — Admin portal</title>
<link rel="stylesheet" href="styles.css?v=phase1"><script defer src="order-config.js?v=1"></script><script defer src="admin.js?v=1"></script></head>
<body><main class="container" style="max-width:900px;padding:40px 16px">
<h1>Cakes by Sharn — Enquiries &amp; Orders</h1><p>Private administration. Each authorised team member signs in with their own account.</p>
<section id="admin-login"><form id="login-form"><label>Email <input id="admin-email" type="email" autocomplete="username" required></label>
<label>Password <input id="admin-password" type="password" autocomplete="current-password" required></label>
<button class="button button-primary" type="submit">Sign in</button></form></section>
<section id="admin-dashboard" hidden><button id="admin-refresh" class="button button-outline">Refresh enquiries</button>
<button id="admin-signout" class="button button-outline">Sign out</button><div id="admin-orders"></div></section>
<p id="admin-status" role="status" aria-live="polite"></p></main></body></html>
